name: agent-kit

on:
  push:
    branches: [master]
    paths:
      - 'skills/agent-kit/**'
      - 'tests/agent-kit/**'
      - 'scripts/agent-kit/**'
      - 'scripts/checks/agent-kit.sh'
      - 'docs/agent-kit/**'
      - '.github/workflows/agent-kit.yml'
  pull_request:
    paths:
      - 'skills/agent-kit/**'
      - 'tests/agent-kit/**'
      - 'scripts/agent-kit/**'
      - 'scripts/checks/agent-kit.sh'
      - 'docs/agent-kit/**'
      - '.github/workflows/agent-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Git identity for harness temp repos
        run: |
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "agent-kit ci"

      # CI runs only the fast subset; run the full suite locally (bash tests/agent-kit/run-all.sh) before a release.
      - name: Quick agent-kit suite
        run: bash tests/agent-kit/run-all.sh --quick

  windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable autocrlf before checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Git identity for harness temp repos
        run: |
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "agent-kit ci"

      - name: Reject CR in Windows loop scripts
        run: |
          for f in tests/agent-kit/templates/loop-windows.sh skills/agent-kit/templates/loop/loop.sh skills/agent-kit/templates/loop/breaker.sh; do
            if grep -q $'\r' "$f"; then
              echo "CR byte found in $f" >&2
              exit 1
            fi
          done

      - name: Windows loop integration suite
        run: bash tests/agent-kit/templates/loop-windows.sh

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.x'

      - name: Verify python3 for loop harness
        if: ${{ !cancelled() }}
        run: |
          # setup-python on Windows exposes python.exe; give Git Bash a python3 when it is missing.
          if ! command -v python3 >/dev/null 2>&1; then
            shim_dir="$(cygpath -u "$RUNNER_TEMP")/python3-shim"
            mkdir -p "$shim_dir"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$shim_dir/python3"
            chmod +x "$shim_dir/python3"
            cygpath -w "$shim_dir" >> "$GITHUB_PATH"
            export PATH="$shim_dir:$PATH"
          fi
          python3 -c 'import sys; print(sys.version.split()[0])'

      - name: Loop harness under Git Bash
        if: ${{ !cancelled() }}
        run: bash tests/agent-kit/run-all.sh --only loop-harness

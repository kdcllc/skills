name: agent-composer

on:
  push:
    branches: [master]
    paths:
      - 'skills/agent-composer/**'
      - 'tests/agent-composer/**'
      - 'scripts/checks/agent-composer.sh'
      - '.github/workflows/agent-composer.yml'
  pull_request:
    paths:
      - 'skills/agent-composer/**'
      - 'tests/agent-composer/**'
      - 'scripts/checks/agent-composer.sh'
      - '.github/workflows/agent-composer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: agent-composer test suite
        run: bash tests/agent-composer/run.sh

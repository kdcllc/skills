name: orchestration-advisor

on:
  push:
    branches: [master]
    paths:
      - 'skills/orchestration-advisor/**'
      - 'tests/orchestration-advisor/**'
      - 'scripts/checks/orchestration-advisor.sh'
      - '.github/workflows/orchestration-advisor.yml'
  pull_request:
    paths:
      - 'skills/orchestration-advisor/**'
      - 'tests/orchestration-advisor/**'
      - 'scripts/checks/orchestration-advisor.sh'
      - '.github/workflows/orchestration-advisor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The system bash: 3.2 on the macOS runner.
      - name: bash version
        run: /bin/bash --version | head -1

      - name: orchestration-advisor test suite
        run: /bin/bash tests/orchestration-advisor/run.sh

name: Release

on:
  push:
    tags: ['*/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Repo layout, frontmatter, and marketplaces
        run: bash scripts/validate-skills.sh

      - name: Resolve skill and version from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%/v*}"
          version="${TAG##*/v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag ${TAG} is not <skill>/vX.Y.Z"; exit 1; }
          [[ -f "skills/${name}/SKILL.md" ]] || { echo "::error::tag ${TAG} names no skill under skills/"; exit 1; }
          recorded="$(awk '
            NR == 1 { next }
            /^---$/ { exit }
            /^metadata:/ { in_meta = 1; next }
            in_meta && /^[^ \t]/ { exit }
            in_meta && $1 == "version:" { v = $2; gsub(/["\047]/, "", v); print v; exit }
          ' "skills/${name}/SKILL.md")"
          [[ "$recorded" == "$version" ]] || { echo "::error::tag ${TAG} does not match metadata.version ${recorded}"; exit 1; }
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' "skills/${NAME}/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release create "$TAG" --title "${NAME} v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

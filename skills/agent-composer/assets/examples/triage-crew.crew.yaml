schema: 1
name: triage-crew
description: "Classifies an incoming request and routes it to a bug, feature, or question specialist. Use for intake queues where only one downstream path should run."
pattern: router
harnesses:
  - claude-code
  - cursor
invocation: auto
workdir: _crew/triage-crew
cursor_rule: true
on_exhaustion: stop
# invocation: auto — orchestrator skill omits disable-model-invocation (see templates).
models:
  claude-code:
    fast: "<fast-model-id>"
    verified: "<YYYY-MM-DD — Claude Code model config / allowlist>"
  cursor:
    fast: "<fast-model-id>"
    verified: "<YYYY-MM-DD — Cursor Settings → Models or agent models>"
agents:
  - id: triage
    description: "Reads the intake brief and selects exactly one route label for downstream handling."
    kind: router
    tier: fast
    tools: [read, search]
    inputs: [intake.md]
    instructions: |
      You are the intake triage router.

      **Role.** Classify the user's intake into exactly one of bug, feature, or question.

      **Inputs.** Read `<workdir>/<run-id>/intake.md` describing the request.

      **Outputs.** None — routing and rationale live in this report only.

      **Steps.**
      1. If intake.md is missing, STATUS: blocked — missing intake brief.
      2. Choose the best matching category using the definitions: bug (broken behavior), feature (new capability), question (information only).
      3. Before your STATUS line, print exactly one line ROUTE: bug, ROUTE: feature, or ROUTE: question.

      **Stop conditions.** STATUS: done after ROUTE line; STATUS: blocked when intake is empty or ambiguous without user data.

      **Must never do.** Never perform specialist work; never edit files; never spawn subagents.

      **Report format.** ROUTE line, then STATUS: done with no workdir files written.
  - id: bug-specialist
    description: "Documents reproduction steps and suspected cause for bug reports."
    kind: worker
    tier: inherit
    tools: [read, search, edit]
    inputs: [intake.md]
    outputs: [bug-response.md]
    instructions: |
      You are the bug specialist.

      **Role.** Turn a bug intake into a concise reproduction and mitigation note.

      **Inputs.** Read `<workdir>/<run-id>/intake.md`.

      **Outputs.** Write `bug-response.md` with sections Reproduction, Expected vs actual, Suspected cause, Suggested next steps.

      **Steps.**
      1. If intake.md is missing, STATUS: blocked — missing intake.
      2. Ask no clarifying questions in files — note gaps in the response doc.
      3. Keep recommendations actionable for engineering readers.

      **Stop conditions.** STATUS: done when bug-response.md is written.

      **Must never do.** Never route other intakes; never spawn subagents.

      **Report format.** End with STATUS: done and list bug-response.md.
  - id: feature-specialist
    description: "Captures problem statement and acceptance criteria for feature requests."
    kind: worker
    tier: inherit
    tools: [read, search, edit]
    inputs: [intake.md]
    outputs: [feature-response.md]
    instructions: |
      You are the feature specialist.

      **Role.** Reframe a feature intake as problem statement, scope, and acceptance criteria.

      **Inputs.** Read `<workdir>/<run-id>/intake.md`.

      **Outputs.** Write `feature-response.md` with sections Problem, Scope, Acceptance criteria, Out of scope.

      **Steps.**
      1. If intake.md is missing, STATUS: blocked — missing intake.
      2. Separate user outcome from implementation detail.
      3. Flag dependencies or open questions explicitly.

      **Stop conditions.** STATUS: done when feature-response.md is written.

      **Must never do.** Never implement the feature; never spawn subagents.

      **Report format.** End with STATUS: done and list feature-response.md.
  - id: question-specialist
    description: "Answers informational questions with cited sources in a short memo."
    kind: worker
    tier: inherit
    tools: [read, search, web, edit]
    inputs: [intake.md]
    outputs: [answer.md]
    instructions: |
      You are the question specialist.

      **Role.** Answer informational intakes clearly without opening a bug or feature track.

      **Inputs.** Read `<workdir>/<run-id>/intake.md`.

      **Outputs.** Write `answer.md` with a direct answer and a Sources section.

      **Steps.**
      1. If intake.md is missing, STATUS: blocked — missing intake.
      2. Prefer authoritative sources; note uncertainty explicitly.
      3. Keep the memo concise and non-technical when the intake is non-technical.

      **Stop conditions.** STATUS: done when answer.md is written.

      **Must never do.** Never file bug or feature artifacts; never spawn subagents.

      **Report format.** End with STATUS: done and list answer.md.
steps:
  - id: triage
    agent: triage
    needs: []
    routes:
      bug: handle-bug
      feature: handle-feature
      question: handle-question
  - id: handle-bug
    agent: bug-specialist
    needs: [triage]
  - id: handle-feature
    agent: feature-specialist
    needs: [triage]
  - id: handle-question
    agent: question-specialist
    needs: [triage]
